<style>
/* Layout: one centred column. Header, the video at 16:9, one line underneath. */
:root{
  --bg:#eef3f7; --fg:#0b2545; --muted:#52677d; --line:#cdd9e4; --accent:#1f8a4c; --stage:#0b2545;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08131f; --fg:#e7eef6; --muted:#97a9bc; --line:#1f3347; --accent:#46c07a; --stage:#000; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08131f; --fg:#e7eef6; --muted:#97a9bc; --line:#1f3347; --accent:#46c07a; --stage:#000; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,4.6vw,2.1rem);line-height:1.15;margin:0;text-wrap:balance}
.stage{background:var(--stage);border-radius:6px;overflow:hidden;aspect-ratio:16/9;max-width:100%;box-shadow:0 0 0 1px var(--line)}
video{display:block;width:100%;height:100%;object-fit:contain}
.hint{margin:0;color:var(--muted);font-size:.9rem}
footer{border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:.8rem}
</style>
